<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <radialGradient id="ambientGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff0055" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#ff7700" stop-opacity="0.5" />
      <stop offset="85%" stop-color="#3ea6ff" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="screenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2a2a2a" />
      <stop offset="100%" stop-color="#141414" />
    </linearGradient>
  </defs>

  <!-- Ambient Light Field -->
  <rect x="0" y="0" width="128" height="128" rx="28" fill="#0d0d0d" />
  <circle cx="64" cy="64" r="54" fill="url(#ambientGlow)" />

  <!-- Radiating Rays -->
  <g stroke="#ffffff" stroke-width="3" stroke-linecap="round" opacity="0.65">
    <line x1="64" y1="14" x2="64" y2="22" />
    <line x1="64" y1="106" x2="64" y2="114" />
    <line x1="14" y1="64" x2="22" y2="64" />
    <line x1="106" y1="64" x2="114" y2="64" />
    <line x1="28" y1="28" x2="35" y2="35" />
    <line x1="93" y1="93" x2="100" y2="100" />
    <line x1="28" y1="100" x2="35" y2="93" />
    <line x1="93" y1="35" x2="100" y2="28" />
  </g>

  <!-- Music Player Screen -->
  <rect x="36" y="36" width="56" height="56" rx="10" fill="url(#screenGrad)" stroke="#ffffff" stroke-width="2.5" />

  <!-- Play Symbol / Music Note -->
  <polygon points="56,48 76,64 56,80" fill="#ffffff" />
</svg>
